<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TableGrab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1626;
    --navy-2: #101f38;
    --gold: #c9a227;
    --gold-bright: #e0bb3a;
    --paper: #f2ead2;
    --muted: #9fb0c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 300px;
    padding: 18px;
    background: var(--navy);
    color: var(--paper);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  }
  h1 {
    margin: 0 0 2px;
    font-family: "Sora", system-ui, sans-serif;
    font-size: 20px;
    letter-spacing: 0.2px;
  }
  h1 .gold { color: var(--gold); }
  .tagline { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .group-label {
    margin: 12px 0 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  button {
    display: block;
    width: 100%;
    margin: 0 0 8px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    background: var(--navy-2);
    color: var(--paper);
    font: 600 13px "Plus Jakarta Sans", system-ui, sans-serif;
    cursor: pointer;
    text-align: left;
  }
  button:hover { background: #1d3355; }
  button.primary { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  button.primary:hover { background: var(--gold-bright); }
  #status { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: var(--gold-bright); }
  .foot { margin: 8px 0 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <h1>Table<span class="gold">Grab</span></h1>
  <p class="tagline">Copy any web table. Free, unlimited, no account.</p>

  <p class="group-label">Largest table on this page</p>
  <button class="primary" data-format="markdown">Copy as Markdown</button>
  <button data-format="csv">Copy as CSV</button>
  <button data-format="tsv">Copy as TSV</button>

  <p class="group-label">Or pick a table yourself</p>
  <button id="enable-buttons">Show copy buttons on this page</button>

  <p id="status" role="status"></p>
  <p class="foot">Nothing is collected. The copy happens only when you click.</p>

  <script src="popup.js"></script>
</body>
</html>
